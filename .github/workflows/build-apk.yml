name: Construire APK Android

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Decompresser le projet
        shell: bash
        run: |
          rm -rf buildsrc
          mkdir buildsrc
          unzip -q La-Tour-des-Mots-source.zip -d buildsrc
          test -f buildsrc/la-tour-des-mots-apk/package.json

      - name: Installer Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Installer Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Installer Android SDK 36
        shell: bash
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Installer les dependances
        working-directory: buildsrc/la-tour-des-mots-apk
        run: npm install --no-audit --no-fund

      - name: Creer le projet Android
        working-directory: buildsrc/la-tour-des-mots-apk
        run: npm run android:prepare

      - name: Construire l APK
        working-directory: buildsrc/la-tour-des-mots-apk/android
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Renommer l APK
        shell: bash
        run: |
          cp buildsrc/la-tour-des-mots-apk/android/app/build/outputs/apk/debug/app-debug.apk La-Tour-des-Mots-debug.apk

      - name: Publier l APK
        uses: actions/upload-artifact@v4
        with:
          name: La-Tour-des-Mots-APK
          path: La-Tour-des-Mots-debug.apk
          if-no-files-found: error
          retention-days: 30
